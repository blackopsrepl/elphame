# Release configuration for csemver. csemver reads only this file and runs no
# configuration code; versions are read and written by its native updaters.
#
# VERSION at the repository root is the single source of truth for the
# application version, and config/initializers/version.rb reads it at boot.
# VERSION carries explanatory comments, so it is matched on its one bare
# semver line; the plain-text updater would replace the whole file, comments
# included.
#
# `types` is declared explicitly because this repository's documentation is a
# product surface: the README is the install guide and app/views/skill is the
# agent-facing API contract. feat and fix drive the version bump; every other
# visible type is listed in the changelog without selecting a bump of its own,
# which is how the conventional preset treated them under the old tool.
tagPrefix = "v"
releaseCommitMessageFormat = "chore(release): {{currentTag}}"
commitUrlFormat = "https://github.com/blackopsrepl/elphame/commit/{{hash}}"
compareUrlFormat = "https://github.com/blackopsrepl/elphame/compare/{{previousTag}}...{{currentTag}}"
issueUrlFormat = "https://github.com/blackopsrepl/elphame/issues/{{id}}"

packageFiles = [
  { filename = "VERSION", type = "regex", pattern = '^([0-9]+\.[0-9]+\.[0-9]+)$', versionGroup = 1 },
]

bumpFiles = [
  { filename = "VERSION", type = "regex", pattern = '^([0-9]+\.[0-9]+\.[0-9]+)$', versionGroup = 1 },
]

types = [
  { type = "feat", section = "Features", effect = "bump" },
  { type = "fix", section = "Bug Fixes", effect = "bump" },
  { type = "perf", section = "Performance", effect = "changelog" },
  { type = "docs", section = "Documentation", effect = "changelog" },
  { type = "test", section = "Tests", effect = "changelog" },
  { type = "build", section = "Build", effect = "changelog" },
  { type = "ci", section = "Build", effect = "changelog" },
  { type = "refactor", section = "Refactoring", effect = "changelog" },
  { type = "chore", effect = "hidden" },
  { type = "style", effect = "hidden" },
]
