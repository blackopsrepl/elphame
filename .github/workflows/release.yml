name: Release

# Cuts a GitHub release when a version tag is pushed.
#
# The release BODY is the tagged version's own CHANGELOG section, extracted from
# the CHANGELOG.md that the release commit generated — not GitHub's guessed
# commit list. If that section is missing the job fails closed rather than
# publishing an empty release.
#
# The heading matcher accepts both shapes commit-and-tag-version emits:
#   ## 1.0.0 (2026-10-03)                                   <- no previous tag
#   ## [1.1.0](...compare/v1.0.0...v1.1.0) (2026-11-01)      <- with a previous tag
#
# workflow_dispatch.backfill=true re-runs the same path for every tag that has no
# release object yet, which is how a tag predating this workflow gets published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v1.0.0)'
        required: false
      backfill:
        description: 'Backfill releases for every tag that has no release yet'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the tag to release
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG section
        id: notes
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          script/extract-changelog-section "${TAG#v}" CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $TAG; refusing to publish an empty release."
            exit 1
          fi
          cat /tmp/notes.md

      - name: Create the release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: /tmp/notes.md

      - name: Backfill releases for tags that have no release yet
        if: github.event_name == 'workflow_dispatch' && inputs.backfill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in $(git tag --sort=v:refname); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release exists: $tag"
              continue
            fi
            script/extract-changelog-section "${tag#v}" CHANGELOG.md > /tmp/notes.md
            if [ ! -s /tmp/notes.md ]; then
              echo "::error::no CHANGELOG section for $tag"
              exit 1
            fi
            gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
            echo "created release: $tag"
          done
